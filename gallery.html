<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery — Art by Beckman</title>
    <meta name="description" content="Full portfolio gallery of Fredrik Beckman — 271 abstract paintings. Bold expressionism in acrylic, glitter and unapologetic color.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style-v3.css">
    <script src="js/data.js" defer></script>
    <script src="js/mobile-menu.js" defer></script>
    <script src="js/gallery.js" defer></script>
</head>

<body>
    <header>
        <div class="logo">Art by Beckman</div>
        <div class="menu-toggle" id="menu-toggle" aria-label="Open navigation" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <nav id="nav">
            <a href="index.html">Home</a>
            <a href="gallery.html" class="active">Gallery</a>
            <a href="videos.html">Videos</a>
            <a href="instagram.html">Instagram</a>
        </nav>
    </header>

    <main>
        <div class="gallery-page-header">
            <h1>Gallery</h1>
            <div class="gallery-search-bar">
                <input type="text" id="gallery-search" placeholder="Search by title, year, medium..." aria-label="Search artworks">
            </div>
        </div>

        <div id="gallery-grid" class="gallery-grid">
            <!-- Gallery items injected by js/gallery.js -->
        </div>
    </main>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="gallery-modal" aria-hidden="true" role="dialog" aria-label="Artwork lightbox">
        <button class="gallery-modal-close" id="lightbox-close" aria-label="Close modal">&times;</button>
        <button class="gallery-modal-btn gallery-modal-prev" id="lightbox-prev" aria-label="Previous artwork">&#10094;</button>
        <div class="gallery-modal-content">
            <img id="lightbox-img" src="" alt="Full size artwork">
            <div id="lightbox-caption" class="gallery-modal-caption"></div>
        </div>
        <button class="gallery-modal-btn gallery-modal-next" id="lightbox-next" aria-label="Next artwork">&#10095;</button>
    </div>

    <footer>
        <div class="footer-logo">Art by Beckman</div>
        <div class="footer-copy">© 2026 Fredrik Beckman. All rights reserved.</div>
    </footer>
</body>
</html>
