<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141622"/>
      <stop offset="100%" stop-color="#08090f"/>
    </linearGradient>
    <linearGradient id="facetGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#F77F00"/>
    </linearGradient>
    <linearGradient id="facetPink" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D62246"/>
      <stop offset="100%" stop-color="#FF007F"/>
    </linearGradient>
    <linearGradient id="facetBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CC9F0"/>
      <stop offset="100%" stop-color="#4361EE"/>
    </linearGradient>
    <linearGradient id="facetPurple" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7209B7"/>
      <stop offset="100%" stop-color="#3A0CA3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>
  
  <!-- Sleek rounded dark canvas -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#262b42" stroke-width="6"/>

  <!-- Origami & Abstract Expressionist Composition -->
  <g filter="url(#glow)">
    <!-- Base Violet Facet -->
    <polygon points="120,380 230,140 340,290 190,430" fill="url(#facetPurple)" opacity="0.95"/>
    <!-- Cyan & Ultramarine Azure Wing -->
    <polygon points="230,140 410,110 340,290 280,230" fill="url(#facetBlue)" opacity="0.95"/>
    <!-- Golden Warm Fold -->
    <polygon points="340,290 410,110 440,330 320,410" fill="url(#facetGold)" opacity="0.95"/>
    <!-- Neon Magenta Dynamic Slash -->
    <polygon points="140,340 280,230 320,410 180,440" fill="url(#facetPink)" opacity="0.92"/>
    <!-- Central Prismatic Highlight -->
    <polygon points="230,140 340,290 280,230" fill="#FFF176" opacity="0.88"/>
  </g>
</svg>
